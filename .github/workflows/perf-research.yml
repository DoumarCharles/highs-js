# Experimental performance research (branch perf-research only).
# Builds the production WebAssembly configuration ("baseline") and one
# candidate from the same HiGHS commit and toolchain, then benchmarks them
# sequentially on a single runner. Synthetic public models only.
# Settings: research/bench-config.json. Write-up: research/RESEARCH.md.
name: Perf research

on:
  push:
    branches: [perf-research]
    paths:
      - "research/**"
      - ".github/workflows/perf-research.yml"

concurrency:
  group: perf-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      emsdk: ${{ steps.c.outputs.emsdk }}
      node: ${{ steps.c.outputs.node }}
      variants: ${{ steps.c.outputs.variants }}
      candidate: ${{ steps.c.outputs.candidate }}
      seeds: ${{ steps.c.outputs.seeds }}
      reps: ${{ steps.c.outputs.reps }}
      tiers: ${{ steps.c.outputs.tiers }}
      time_limit: ${{ steps.c.outputs.time_limit }}
      native_configs: ${{ steps.c.outputs.native_configs }}
      native_reps: ${{ steps.c.outputs.native_reps }}
      wasm_variants: ${{ steps.c.outputs.wasm_variants }}
      api_test: ${{ steps.c.outputs.api_test }}
      summarizer: ${{ steps.c.outputs.summarizer }}
      label: ${{ steps.c.outputs.label }}
      diagnose: ${{ steps.c.outputs.diagnose }}
    steps:
      - uses: actions/checkout@v6
      - id: c
        run: |
          . ./.env
          echo "emsdk=$EMSDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          cfg=research/bench-config.json
          cand=$(jq -r .candidate $cfg)
          echo "candidate=$cand" >> "$GITHUB_OUTPUT"
          # Builds to make (default: baseline + candidate).
          echo "variants=$(jq -c --arg c "$cand" '.builds // ["baseline", $c]' $cfg)" >> "$GITHUB_OUTPUT"
          # Timed variants: name=build[@threads[@parallel]] (default: baseline vs candidate).
          echo "wasm_variants=$(jq -r --arg c "$cand" '.wasmVariants // "baseline=baseline,\($c)=\($c)"' $cfg)" >> "$GITHUB_OUTPUT"
          echo "api_test=$(jq -r '.apiTest // false' $cfg)" >> "$GITHUB_OUTPUT"
          echo "summarizer=$(jq -r '.summarizer // "ab"' $cfg)" >> "$GITHUB_OUTPUT"
          echo "label=$(jq -r --arg c "$cand" '.label // $c' $cfg)" >> "$GITHUB_OUTPUT"
          echo "diagnose=$(jq -r '.diagnose // false' $cfg)" >> "$GITHUB_OUTPUT"
          echo "seeds=$(jq -r .seeds $cfg)" >> "$GITHUB_OUTPUT"
          echo "reps=$(jq -r .reps $cfg)" >> "$GITHUB_OUTPUT"
          echo "tiers=$(jq -r .tiers $cfg)" >> "$GITHUB_OUTPUT"
          echo "time_limit=$(jq -r .timeLimit $cfg)" >> "$GITHUB_OUTPUT"
          echo "native_configs=$(jq -r .nativeConfigs $cfg)" >> "$GITHUB_OUTPUT"
          echo "native_reps=$(jq -r '.nativeReps // 1' $cfg)" >> "$GITHUB_OUTPUT"

  build-wasm:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: ${{ fromJSON(needs.config.outputs.variants) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v16
        with: { version: "${{ needs.config.outputs.emsdk }}" }
      - uses: actions/setup-node@v6
        with:
          node-version: "${{ needs.config.outputs.node }}"
          package-manager-cache: false
      - run: npm ci
      - name: Build ${{ matrix.variant }}
        # On failure the first error lines become annotations, readable
        # through the checks API without downloading logs.
        run: |
          set -o pipefail
          bash research/build-variant.sh "${{ matrix.variant }}" "dist/${{ matrix.variant }}" 2>&1 | tee build-variant.log || {
            grep -E "error[: ]|Error " build-variant.log | grep -v "^--" | head -n 8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }
      - name: Smoke test
        run: node research/scripts/smoke.cjs "dist/${{ matrix.variant }}/highs.js"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.variant }}
          path: dist/${{ matrix.variant }}
          if-no-files-found: error

  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build native HiGHS (same submodule commit, threads enabled)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build time
          cmake -S HiGHS -B native -G Ninja -DCMAKE_BUILD_TYPE=Release -DFAST_BUILD=ON -DBUILD_SHARED_LIBS=OFF -DZLIB=OFF -DBUILD_TESTING=OFF
          cmake --build native --target highs-bin 2>/dev/null || cmake --build native
          ls -la native/bin
          native/bin/highs --version
          ldd native/bin/highs
      - uses: actions/upload-artifact@v4
        with:
          name: native-highs
          path: native/bin/highs
          if-no-files-found: error

  bench:
    needs: [config, build-wasm, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write # only to push results to the perf-research-results branch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "${{ needs.config.outputs.node }}"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: wasm-*, merge-multiple: false }
      - uses: actions/download-artifact@v4
        with: { name: native-highs, path: native }
      - name: Runner
        run: |
          sudo apt-get install -y -qq time >/dev/null
          chmod +x native/highs
          nproc; lscpu | grep -E "Model name|^CPU\(s\)|Thread|MHz" || true; free -m; node --version
      - name: Generate synthetic models
        run: node research/models/generate.mjs models
      - name: Diagnose threaded solves
        if: needs.config.outputs.diagnose == 'true'
        run: |
          mkdir -p results
          for b in dist/wasm-*; do
            [ -f "$b/highs.js" ] || continue
            for t in 1 2 4; do
              echo "=== $b threads=$t ===" | tee -a results/diagnose.txt
              timeout 120 node --trace-uncaught research/scripts/repro-threads.cjs "$b/highs.js" models/gapd_a5_j50_s4.lp $t 5 2>&1 \
                | grep -v "^\[out\] *[A-Z ] *[0-9]" | tail -n 60 | tee -a results/diagnose.txt || true
            done
          done
      - name: WebAssembly interface and callback tests
        if: needs.config.outputs.api_test == 'true'
        run: |
          node research/scripts/pthread-api-test.mjs --module dist/wasm-pthreads/highs.js \
            --models models --out results/api-test.json
      - name: WebAssembly benchmark (sequential, rotating order)
        if: always()
        run: |
          spec=""
          IFS=',' read -ra items <<< "${{ needs.config.outputs.wasm_variants }}"
          for item in "${items[@]}"; do
            name="${item%%=*}"; rest="${item#*=}"; build="${rest%%@*}"
            extra=""; [ "$rest" != "$build" ] && extra="@${rest#*@}"
            spec="${spec:+$spec,}${name}=dist/wasm-${build}/highs.js${extra}"
          done
          echo "variants: $spec"
          node research/scripts/bench.mjs --variants "$spec" \
            --models models --seeds "${{ needs.config.outputs.seeds }}" --reps "${{ needs.config.outputs.reps }}" \
            --tiers "${{ needs.config.outputs.tiers }}" --time-limit "${{ needs.config.outputs.time_limit }}" \
            --out results/wasm.jsonl
      - name: Native reference (threads 1, parallel on with 2 and 4 threads)
        if: always() && needs.config.outputs.native_configs != 'none'
        run: |
          node research/scripts/native-bench.mjs --highs native/highs --models models \
            --seeds "${{ needs.config.outputs.seeds }}" --configs "${{ needs.config.outputs.native_configs }}" \
            --reps "${{ needs.config.outputs.native_reps }}" \
            --tiers "${{ needs.config.outputs.tiers }}" --time-limit "${{ needs.config.outputs.time_limit }}" \
            --out results/native.jsonl
      - name: Summary
        if: always()
        run: |
          infos=$(ls -d dist/wasm-* | paste -sd, -)
          if [ "${{ needs.config.outputs.summarizer }}" = "threads" ]; then
            node research/scripts/summarize-threads.mjs --wasm results/wasm.jsonl --api results/api-test.json \
              --build-info "$infos" | tee results/summary.md
          else
            node research/scripts/summarize.mjs --wasm results/wasm.jsonl --native results/native.jsonl \
              --build-info "$infos" | tee results/summary.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results-${{ needs.config.outputs.label }}
          path: |
            results
            dist/*/build-info.txt
      # Results (synthetic models only) are also committed to the separate
      # perf-research-results branch so they can be read without artifact
      # downloads. Never pushes to any other branch.
      - name: Publish results to perf-research-results
        if: always()
        env:
          TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.config.outputs.label }}
        run: |
          dir="runs/$(date -u +%Y%m%dT%H%M%SZ)-run${{ github.run_id }}-${CANDIDATE}"
          mkdir -p "pub/$dir"
          cp -r results/. "pub/$dir/"
          for d in dist/wasm-*; do cp "$d/build-info.txt" "pub/$dir/build-info-${d#dist/wasm-}.txt"; done
          cp research/bench-config.json "pub/$dir/"
          echo "${{ github.sha }}" > "pub/$dir/source-commit.txt"
          cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin perf-research-results; then
            git checkout -q -b perf-research-results FETCH_HEAD
          else
            git checkout -q --orphan perf-research-results
          fi
          git add -A runs
          git commit -q -m "perf results run ${{ github.run_id }} (${CANDIDATE})"
          for i in 1 2 3; do
            git push -q origin HEAD:perf-research-results && break
            git fetch -q --depth 1 origin perf-research-results && git rebase -q FETCH_HEAD
          done
