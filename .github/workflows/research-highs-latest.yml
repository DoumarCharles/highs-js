# Research build of highs-js against an exact upstream HiGHS `latest` commit
# (branch research/highs-latest-20261015 only). Uses the canonical toolchain
# from .env, runs check:api, build, test, test:package and an LP/MIP smoke test
# of both this build and the published highs@1.15.3 reference, and reports the
# results as check annotations. Publishes nothing. See research/HIGHS-LATEST.md.
name: Research HiGHS latest

on:
  push:
    branches: [research/highs-latest-20261015]

concurrency:
  group: research-highs-latest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - id: versions
        name: Read canonical versions
        run: |
          . ./.env
          echo "emsdk=$EMSDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: mymindstorm/setup-emsdk@v16
        with: { version: "${{ steps.versions.outputs.emsdk }}" }
      - uses: actions/setup-node@v6
        with:
          node-version: "${{ steps.versions.outputs.node }}"
          package-manager-cache: false
      - name: Restore C++ archives
        id: cache-archives
        uses: actions/cache/restore@v4
        with:
          path: build/lib
          key: ${{ runner.os }}-emsdk-${{ steps.versions.outputs.emsdk }}-archives-${{ hashFiles('HiGHS/**/*.cmake', 'HiGHS/**/CMakeLists.txt', 'HiGHS/highs/**/*.cpp', 'HiGHS/highs/**/*.h', 'build.sh') }}
      - run: npm ci
      - name: Run checks, build, tests and smoke tests
        env:
          HIGHS_SKIP_MAKE: ${{ steps.cache-archives.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          set +e
          mkdir -p research-logs
          {
            echo "highs-js commit: $(git rev-parse HEAD)"
            echo "HiGHS submodule: $(git -C HiGHS rev-parse HEAD)"
            echo "HiGHS describe:  $(git -C HiGHS describe --always)"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            emcc --version | head -1
            echo "archive cache hit: ${{ steps.cache-archives.outputs.cache-hit }}"
          } > research-logs/toolchain.log 2>&1
          echo 0 > research-logs/toolchain.code
          step() {
            local name="$1"; shift
            "$@" > "research-logs/$name.log" 2>&1
            echo $? > "research-logs/$name.code"
          }
          step check-api npm run check:api
          step build npm run build
          step test npm test
          # Diagnostics only: npm test stops at the first failing stage, so also
          # run the legacy and extended suites independently to see every failure.
          step test-legacy node tests/test.js
          step test-extended node --test tests/extended/*.test.cjs
          step test-package npm run test:package
          step smoke node research/smoke.mjs build --expect-hash "$(git -C HiGHS rev-parse --short=7 HEAD)"
          # Published production reference, loaded side by side from its own directory.
          mkdir -p reference
          step reference-fetch bash -c 'cd reference && npm pack highs@1.15.3 && tar -xzf highs-1.15.3.tgz'
          step smoke-reference node research/smoke.mjs reference/package --expect-hash 04024d7
          {
            ls -l build/highs.js build/highs.mjs build/highs.wasm reference/package/build/highs.wasm
            sha256sum build/highs.js build/highs.mjs build/highs.wasm reference/package/build/highs.wasm
          } > research-logs/artifacts.log 2>&1
          echo $? > research-logs/artifacts.code
          exit 0
      - name: Save C++ archives
        if: always() && steps.cache-archives.outputs.cache-hit != 'true' && hashFiles('build/lib/*.a') != ''
        uses: actions/cache/save@v4
        with:
          path: build/lib
          key: ${{ steps.cache-archives.outputs.cache-primary-key }}
      - name: Report toolchain
        if: always()
        run: node research/ci-report.mjs toolchain research-logs/toolchain.log research-logs/toolchain.code
      - name: Report check:api
        if: always()
        run: node research/ci-report.mjs check:api research-logs/check-api.log research-logs/check-api.code
      - name: Report build
        if: always()
        run: node research/ci-report.mjs build research-logs/build.log research-logs/build.code
      - name: Report test
        if: always()
        run: node research/ci-report.mjs test research-logs/test.log research-logs/test.code
      - name: Report legacy suite (diagnostic)
        if: always()
        run: node research/ci-report.mjs test-legacy research-logs/test-legacy.log research-logs/test-legacy.code
      - name: Report extended suite (diagnostic)
        if: always()
        run: node research/ci-report.mjs test-extended research-logs/test-extended.log research-logs/test-extended.code
      - name: Report test:package
        if: always()
        run: node research/ci-report.mjs test:package research-logs/test-package.log research-logs/test-package.code
      - name: Report smoke (research build)
        if: always()
        run: node research/ci-report.mjs smoke research-logs/smoke.log research-logs/smoke.code
      - name: Report smoke (highs@1.15.3 reference)
        if: always()
        run: |
          node research/ci-report.mjs reference-fetch research-logs/reference-fetch.log research-logs/reference-fetch.code
          node research/ci-report.mjs smoke-reference research-logs/smoke-reference.log research-logs/smoke-reference.code
      - name: Report artifacts
        if: always()
        run: node research/ci-report.mjs artifacts research-logs/artifacts.log research-logs/artifacts.code
      - name: Pack research build
        if: always() && hashFiles('build/highs.wasm') != ''
        run: npm pack && mv highs-*.tgz highs-research-latest.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highs-research-latest
          path: |
            highs-research-latest.tgz
            build/highs.js
            build/highs.mjs
            build/highs.wasm
            research-logs/
          if-no-files-found: warn
      - name: Fail if any command failed
        if: always()
        run: |
          failed=0
          for f in research-logs/*.code; do
            if [ "$(cat "$f")" != "0" ]; then echo "::error::$(basename "$f" .code) exited $(cat "$f")"; failed=1; fi
          done
          exit $failed
